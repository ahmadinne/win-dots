rules:
  - app: 'AutoHotkey'
    focus: true
    floating: true

  - app: 'AutoHotkeyV1'
    focus: true
    floating: true

  - app: 'AutoHotkeyV2'
    focus: true
    floating: true

window_rules:
  - commands: ['set-minimized']
    match:
      - window_process: { equals: 'hap' }

  - commands: ['set-floating']
    match:
    - window_process: { equals: 'Bitwarden' }

  - commands: ['ignore']
    match:
      # Ignores any Yasb windows.
      - window_process: { equals: 'AutoHotkey' }
      - window_process: { equals: 'AutoHotkeyV1' }
      - window_process: { equals: 'AutoHotkeyV2' }
      - window_process: { equals: 'zebar' }
      - window_process: { equals: 'yasb' }
      - window_process: { equals: 'hap' }
      - window_process: { equals: 'buttery-taskbar' }
      - window_process: { equals: 'GoogleDriveFS'}

      # Ignores picture-in-picture windows for browsers.
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
        window_class: { regex: 'Chrome_WidgetWin_1|MozillaDialogClass' }

      # Ignore rules for various 3rd-party apps.
      - window_process: { equals: 'PowerToys' }
        window_class: { regex: 'HwndWrapper\[PowerToys\.PowerAccent.*?\]' }
      - window_title: { equals: 'Command Palette' }
        window_class: { equals: 'WinUIDesktopWin32WindowClass' }
      - window_process: { equals: 'PowerToys' }
        window_title: { regex: '.*? - Peek' }
      - window_process: { equals: 'Lively' }
        window_class: { regex: 'HwndWrapper' }
      - window_process: { equals: 'EXCEL' }
        window_class: { not_regex: 'XLMAIN' }
      - window_process: { equals: 'WINWORD' }
        window_class: { not_regex: 'OpusApp' }
      - window_process: { equals: 'POWERPNT' }
        window_class: { not_regex: 'PPTFrameClass' }

keybindings:
  # Change focus to a workspace defined in `workspaces` config.
  - commands: ['focus --workspace a1']
    bindings: ['alt+1']
  - commands: ['focus --workspace a2']
    bindings: ['alt+2']
  - commands: ['focus --workspace a3']
    bindings: ['alt+3']
  - commands: ['focus --workspace a4']
    bindings: ['alt+4']
  - commands: ['focus --workspace a5']
    bindings: ['alt+5']
  - commands: ['focus --workspace a6']
    bindings: ['alt+6']
  - commands: ['focus --workspace a7']
    bindings: ['alt+7']
  - commands: ['focus --workspace a8']
    bindings: ['alt+8']
  - commands: ['focus --workspace a9']
    bindings: ['alt+9']
  - commands: ['focus --workspace a10']
    bindings: ['alt+0']

  # Move focused window to a workspace defined in `workspaces` config.
  - commands: ['move --workspace a1', 'focus --workspace a1']
    bindings: ['alt+shift+1']                               
  - commands: ['move --workspace a2', 'focus --workspace a2']
    bindings: ['alt+shift+2']                               
  - commands: ['move --workspace a3', 'focus --workspace a3']
    bindings: ['alt+shift+3']                               
  - commands: ['move --workspace a4', 'focus --workspace a4']
    bindings: ['alt+shift+4']                               
  - commands: ['move --workspace a5', 'focus --workspace a5']
    bindings: ['alt+shift+5']                               
  - commands: ['move --workspace a6', 'focus --workspace a6']
    bindings: ['alt+shift+6']                               
  - commands: ['move --workspace a7', 'focus --workspace a7']
    bindings: ['alt+shift+7']                               
  - commands: ['move --workspace a8', 'focus --workspace a8']
    bindings: ['alt+shift+8']                               
  - commands: ['move --workspace a9', 'focus --workspace a9']
    bindings: ['alt+shift+9']
  - commands: ['move --workspace a10', 'focus --workspace a10']
    bindings: ['alt+shift+0']

  # Move the focused window's parent workspace to a monitor in a given
  # direction.
