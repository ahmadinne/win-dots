general:
  startup_commands: [
    "shell-exec %USERPROFILE%/Appdata/Local/Programs/AutoHotkey/UX/AutoHotkeyUX.exe %USERPROFILE%/.config/autohotkey/config.ahk"
  ]

  shutdown_commands: [
    "shell-exec taskkill /IM AutoHotkey64.exe"
  ]

  config_reload_commands: [
    "shell-exec '%USERPROFILE%/Appdata/Local/Programs/AutoHotkey/UX/AutoHotkeyUX.exe' /restart %USERPROFILE%/.config/autohotkey/config.ahk",
  ]

  focus_follows_cursor: true
  toggle_workspace_on_refocus: false

  cursor_jump:
    enabled: true
    trigger: 'monitor_focus' # monitor_focus / window_focus

  hide_method: 'cloak' # cloak / hide
  show_all_in_taskbar: true

gaps:
  scale_with_dpi: true
  inner_gap: '5px'
  outer_gap:
    top: '5px'
    right: '5px'
    bottom: '5px'
    left: '5px'

window_effects:
  # Focused Windows
  focused_window:
    border:
      enabled: true
      color: '#F6DFBF'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'square' # Allowed values: 'square', 'rounded', 'small_rounded'.
    transparency:
      enabled: false
      opacity: '95%'

  # Non Focused Windows / Other Windows
  other_windows:
    border:
      enabled: true
      color: '#000000'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'square'
    transparency:
      enabled: false
      opacity: '70%'

window_behavior:
  initial_state: 'tiling'

  state_defaults:
    floating:
      centered: true
      shown_on_top: true

    fullscreen:
      maximized: false
      shown_on_top: false

workspaces:
  # Monitor 0 / First Monitor
  - name: 'a1'
    display_name: '1'
    bind_to_monitor: 0
  - name: 'a2'
