    bind_to_monitor: 0
  - name: 'a5'
    display_name: '5'
    bind_to_monitor: 0
  - name: 'a6'
    display_name: '6'
    bind_to_monitor: 0
  - name: 'a7'
    display_name: '7'
    bind_to_monitor: 0
  - name: 'a8'
    display_name: '8'
    bind_to_monitor: 0
  - name: 'a9'
    display_name: '9'
    bind_to_monitor: 0
  - name: 'a10'
    display_name: '10'
    bind_to_monitor: 0

  # Monitor 1 / Second Monitor
  - name: 'b1'
    display_name: '1'
    bind_to_monitor: 1
  - name: 'b2'
    display_name: '2'
    bind_to_monitor: 1
  - name: 'b3'
    display_name: '3'
    bind_to_monitor: 1
  - name: 'b4'
    display_name: '4'
    bind_to_monitor: 1
  - name: 'b5'
    display_name: '5'
    bind_to_monitor: 1
  - name: 'b6'
    display_name: '6'
    bind_to_monitor: 1
  - name: 'b7'
    display_name: '7'
    bind_to_monitor: 1
  - name: 'b8'
    display_name: '8'
    bind_to_monitor: 1
  - name: 'b9'
    display_name: '9'
    bind_to_monitor: 1
  - name: 'b10'
    display_name: '10'
    bind_to_monitor: 1

rules:
  - app: 'AutoHotkey64'
    focus: true
    floating: true

window_rules:
  - commands: ['set-minimized']
    match:
      - window_process: { equals: 'hap' }

  - commands: ['set-floating']
    match:
    - window_process: { equals: 'Bitwarden' }
    # - window_class: { regex: 'Chrome_WidgetWin_1|MozillaDialogClass' }

  - commands: ['set-fullscreen']
    match:
      - window_process: { equals: 'Minecraft.Windows' }

  - commands: ['ignore']
    match:
      # Ignores any Yasb windows.
      - window_process: { equals: 'LEGOJurassicWorld' }
      - window_process: { equals: 'AutoHotkey64' }
      - window_process: { equals: 'zebar' }
      - window_process: { equals: 'yasb' }
      - window_process: { equals: 'hap' }
      - window_process: { equals: 'buttery-taskbar' }
      - window_process: { equals: 'GoogleDriveFS'}
      - window_process: { equals: 'NanaZip.Universal.Windows' }
      # - window_process: { equals: 'BongoWaifu'}

      # Ignores picture-in-picture windows for browsers.
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
        window_class: { regex: 'Chrome_WidgetWin_1|MozillaDialogClass' }

      # Ignore rules for various 3rd-party apps.
      - window_process: { equals: 'PowerToys' }
        window_class: { regex: 'HwndWrapper\[PowerToys\.PowerAccent.*?\]' }
      - window_title: { equals: 'Command Palette' }
        window_class: { equals: 'WinUIDesktopWin32WindowClass' }
      - window_process: { equals: 'PowerToys' }
        window_title: { regex: '.*? - Peek' }
      - window_process: { equals: 'Lively' }
        window_class: { regex: 'HwndWrapper' }
      - window_process: { equals: 'EXCEL' }
        window_class: { not_regex: 'XLMAIN' }
      - window_process: { equals: 'WINWORD' }
        window_class: { not_regex: 'OpusApp' }
      - window_process: { equals: 'POWERPNT' }
        window_class: { not_regex: 'PPTFrameClass' }

