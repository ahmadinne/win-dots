general:
  startup_commands: [
    "shell-exec AutoHotkey.exe %USERPROFILE%/.config/autohotkey/config.ahk",
    "shell-exec AutoHotkey.exe %USERPROFILE%/.config/autohotkey/kill.ahk",
    "shell-exec AutoHotkey.exe %USERPROFILE%/.config/autohotkey/mousehide.ahk",
    "shell-exec AutoHotkey.exe %USERPROFILE%/.config/autohotkey/expvim.ahk",
    "shell-exec %USERPROFILE%/AppData/Local/PowerToys/PowerToys.exe",
    "shell-exec %USERPROFILE%/AppData/Roaming/AltSnap/AltSnap.exe"
    "shell-exec yasb",
  ]
  shutdown_commands: [
    "shell-exec taskkill /IM AutoHotkeyV1.exe /",
    "shell-exec taskkill /IM AutoHotkeyV2.exe /",
    "shell-exec taskkill /IM AutoHotkey.exe /",
    "shell-exec taskkill /IM PowerToys.exe /",
    "shell-exec taskkill /IM AltSnap.exe /",
    "shell-exec taskkill /IM yasb.exe /"
  ]
  config_reload_commands: [
    "shell-exec yasbc reload",
    "shell-exec AutoHotkey.exe /restart %USERPROFILE%/.config/autohotkey/config.ahk",
    "shell-exec AutoHotkey.exe /restart %USERPROFILE%/.config/autohotkey/kill.ahk",
    "shell-exec AutoHotkey.exe /restart %USERPROFILE%/.config/autohotkey/mousehide.ahk",
    "shell-exec AutoHotkey.exe /restart %USERPROFILE%/.config/autohotkey/expvim.ahk"
  ]
  focus_follows_cursor: false
  toggle_workspace_on_refocus: false

  cursor_jump:
    enabled: true
    trigger: 'window_focus' #monitor/window

  hide_method: 'cloak' #cloak/hide
  show_all_in_taskbar: false

gaps:
  scale_with_dpi: true
  inner_gap: '3px'
  outer_gap:
    top: '3px'
    right: '3px'
    bottom: '3px'
    left: '3px'

window_effects:
  # Focused Windows
  focused_window:
    border:
      enabled: false
      color: '#000000'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: false
      # Allowed values: 'square', 'rounded', 'small_rounded'.
      style: 'square'
    transparency:
      enabled: false
      opacity: '95%'

  # Non Focused Windows / Other Windows
  other_windows:
    border:
      enabled: false
      color: '#000000'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: false
      style: 'square'
    transparency:
      enabled: false
      opacity: '70%'

window_behavior:
  initial_state: 'tiling'

  state_defaults:
    floating:
      centered: true
      shown_on_top: true

    fullscreen:
      maximized: false
      shown_on_top: false

